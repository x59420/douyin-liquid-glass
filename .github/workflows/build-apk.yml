name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed APK
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dydock-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dydock-apk
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          VER="$(basename "$APK" .apk | sed 's/^dydock-//')"
          TAG="v${VER}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --title "dydock ${VER} (build ${GITHUB_RUN_NUMBER})" \
            --notes "自动构建发布。源码提交：${GITHUB_SHA}"
